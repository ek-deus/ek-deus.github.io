<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RabbitMQ и Kafka — две модели работы с сообщениями</title>
  <desc id="desc">Слева RabbitMQ маршрутизирует сообщения в рабочие очереди. Справа Kafka записывает события в партиционированный журнал, который читают независимые группы потребителей.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b35"/><stop offset="1" stop-color="#172e4a"/></linearGradient>
    <linearGradient id="orange" x2="1"><stop stop-color="#ff9d46"/><stop offset="1" stop-color="#ff6b35"/></linearGradient>
    <linearGradient id="blue" x2="1"><stop stop-color="#3d9cff"/><stop offset="1" stop-color="#5574ff"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#030916" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="560" rx="30" fill="#111d35"/>
  <text x="600" y="62" fill="#f4f7ff" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle">ДВЕ РАЗНЫЕ МОДЕЛИ ОБМЕНА СОБЫТИЯМИ</text>
  <rect x="38" y="96" width="545" height="420" rx="24" fill="#1c2c42" stroke="#ff9347" stroke-width="2"/>
  <rect x="617" y="96" width="545" height="420" rx="24" fill="#1c2c42" stroke="#528bff" stroke-width="2"/>
  <rect x="62" y="118" width="145" height="38" rx="19" fill="#ff9347"/><text x="134" y="144" fill="#28180f" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">RabbitMQ</text>
  <text x="62" y="188" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Сообщение направляется в очередь</text>
  <rect x="72" y="235" width="112" height="65" rx="14" fill="#fff1df" filter="url(#shadow)"/><text x="128" y="275" fill="#49301e" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Producer</text>
  <path d="M185 267h45" stroke="#ffb05d" stroke-width="5"/><path d="m230 267-14-9v18z" fill="#ffb05d"/>
  <rect x="238" y="225" width="135" height="84" rx="14" fill="#ff9347" filter="url(#shadow)"/><text x="305" y="259" fill="#29190e" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Exchange</text><text x="305" y="284" fill="#4a2b16" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">routing rules</text>
  <path d="M374 267h36M410 267v-45h28M410 267v45h28" fill="none" stroke="#ffb05d" stroke-width="4"/>
  <rect x="440" y="195" width="112" height="52" rx="12" fill="#fff1df"/><text x="496" y="228" fill="#49301e" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Queue A</text>
  <rect x="440" y="288" width="112" height="52" rx="12" fill="#fff1df"/><text x="496" y="321" fill="#49301e" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Queue B</text>
  <path d="M496 248v20" stroke="#b7d5ff" stroke-width="3"/><path d="m496 268-7-10h14z" fill="#b7d5ff"/><path d="M496 341v18" stroke="#b7d5ff" stroke-width="3"/><path d="m496 359-7-10h14z" fill="#b7d5ff"/>
  <text x="310" y="405" fill="#ffd3a9" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Один из consumers забирает работу</text>
  <text x="310" y="435" fill="#c7d4e6" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">ack после успешной обработки</text>
  <rect x="642" y="118" width="105" height="38" rx="19" fill="#528bff"/><text x="694" y="144" fill="#101c37" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Kafka</text>
  <text x="642" y="188" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Событие остаётся в журнале</text>
  <rect x="650" y="235" width="105" height="65" rx="14" fill="#e8f2ff" filter="url(#shadow)"/><text x="702" y="275" fill="#17355b" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Producer</text>
  <path d="M756 267h26" stroke="#6e9bff" stroke-width="5"/><path d="m782 267-14-9v18z" fill="#6e9bff"/>
  <rect x="790" y="215" width="140" height="104" rx="14" fill="#426fe8" filter="url(#shadow)"/>
  <text x="860" y="240" fill="#f4f7ff" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">topic / partitions</text>
  <g fill="#dce9ff"><rect x="808" y="254" width="22" height="15" rx="3"/><rect x="837" y="254" width="22" height="15" rx="3"/><rect x="866" y="254" width="22" height="15" rx="3"/><rect x="895" y="254" width="22" height="15" rx="3"/><rect x="808" y="278" width="22" height="15" rx="3"/><rect x="837" y="278" width="22" height="15" rx="3"/><rect x="866" y="278" width="22" height="15" rx="3"/><rect x="895" y="278" width="22" height="15" rx="3"/></g>
  <path d="M931 266h32M963 266v-48h20M963 266v48h20" fill="none" stroke="#6e9bff" stroke-width="4"/>
  <rect x="988" y="192" width="140" height="52" rx="12" fill="#e8f2ff"/><text x="1058" y="224" fill="#17355b" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Group: billing</text>
  <rect x="988" y="291" width="140" height="52" rx="12" fill="#e8f2ff"/><text x="1058" y="323" fill="#17355b" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Group: analytics</text>
  <text x="889" y="405" fill="#bcd2ff" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Группы читают независимо</text>
  <text x="889" y="435" fill="#c7d4e6" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">offset задаёт позицию чтения</text>
  <text x="600" y="545" fill="#a9bbd3" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Очередь работы и журнал событий — разные способы владеть сообщением</text>
</svg>
