<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Подтверждения и повторная обработка сообщений</title>
  <desc id="desc">Producer отправляет сообщение и получает подтверждение брокера. Consumer выполняет операцию, затем подтверждает обработку. Сбой между операцией и подтверждением может привести к повторной доставке, поэтому обработка должна быть идемпотентной.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b35"/><stop offset="1" stop-color="#1b2e49"/></linearGradient><filter id="s" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="470" rx="28" fill="#111d35"/>
  <text x="600" y="56" fill="#f4f7ff" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">ДОСТАВКА ≠ РОВНО ОДНО ВЫПОЛНЕНИЕ</text>
  <rect x="55" y="130" width="205" height="100" rx="18" fill="#fff0df" filter="url(#s)"/><text x="157" y="173" fill="#402b1b" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Producer</text><text x="157" y="201" fill="#6a5542" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">публикует событие</text>
  <rect x="365" y="130" width="205" height="100" rx="18" fill="#dceaff" filter="url(#s)"/><text x="467" y="173" fill="#17355b" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Broker</text><text x="467" y="201" fill="#405b7c" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">сохраняет / доставляет</text>
  <rect x="675" y="130" width="205" height="100" rx="18" fill="#e4f5ee" filter="url(#s)"/><text x="777" y="173" fill="#174a39" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Consumer</text><text x="777" y="201" fill="#42685a" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">выполняет операцию</text>
  <rect x="985" y="130" width="160" height="100" rx="18" fill="#e4f5ee" filter="url(#s)"/><text x="1065" y="173" fill="#174a39" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Бизнес-данные</text><text x="1065" y="201" fill="#42685a" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">БД / API</text>
  <path d="M261 160h94" stroke="#ff9e50" stroke-width="4"/><path d="m355 160-12-8v16z" fill="#ff9e50"/><text x="308" y="145" fill="#ffbd78" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">publish</text>
  <path d="M571 160h94" stroke="#77a5ff" stroke-width="4"/><path d="m665 160-12-8v16z" fill="#77a5ff"/><text x="618" y="145" fill="#b5ceff" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">delivery</text>
  <path d="M881 180h94" stroke="#72d2aa" stroke-width="4"/><path d="m975 180-12-8v16z" fill="#72d2aa"/><text x="928" y="165" fill="#a5ebca" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">commit effect</text>
  <path d="M467 236v61H157v-62" fill="none" stroke="#ffbd78" stroke-width="3" stroke-dasharray="8 7"/><path d="m157 235-8 13h16z" fill="#ffbd78"/><text x="308" y="286" fill="#ffcf9d" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">publisher confirm: брокер принял сообщение</text>
  <path d="M1065 236v72H777v-62" fill="none" stroke="#a5ebca" stroke-width="3" stroke-dasharray="8 7"/><path d="m777 246-8 13h16z" fill="#a5ebca"/><text x="920" y="298" fill="#baf1d8" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">ack / commit offset после обработки</text>
  <rect x="150" y="345" width="900" height="75" rx="16" fill="#3a2630" stroke="#ff7180" stroke-width="2"/>
  <text x="600" y="375" fill="#ffb3bb" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Сбой после изменения БД, но до ack/commit → событие может прийти повторно</text>
  <text x="600" y="402" fill="#f4dce0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Идемпотентный consumer, inbox/outbox и дедупликация защищают бизнес-операцию</text>
</svg>
